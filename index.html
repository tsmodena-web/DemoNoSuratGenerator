const originalRender=render;render=function(){originalRender();if(view==='masters'){document.querySelector('#masters .view-title')?.insertAdjacentHTML('afterend','<p class="help mt-2">Email harus unik per pengguna. Digunakan sebagai identitas login OTP nantinya; tombol Login OTP pada demo hanya simulasi lokal.</p>')}if(view==='templates'){document.querySelectorAll('[data-edit-tpl]').forEach(b=>{const t=item('templates',b.dataset.editTpl),wrap=b.parentElement;if(!ro()||!t||wrap.querySelector('[data-resources]'))return;wrap.insertAdjacentHTML('beforeend',`<button class="btn btn-sm btn-outline-primary" data-resources="${t.id}">Link contoh surat</button><button class="btn btn-sm btn-outline-primary" data-home-toggle="${t.id}">${t.showHome===false?'Tampilkan di Home':'Sembunyikan dari Home'}</button>`)})}if(view==='profile'){let t=item('templates',profileTemplate);if(t){let el=document.querySelector('#profile .card-body');if(el)el.insertAdjacentHTML('beforeend',`<hr><h6>Referensi template surat</h6>${sourceLinks(t)}${ro()?`<div class="mt-2"><button class="btn btn-sm btn-outline-primary" data-resources="${t.id}">Kelola tautan</button></div>`:''}`)}}if(view==='generate'){const f=document.querySelector('#generateForm');if(f&&!document.querySelector('#gReference')){let submit=f.querySelector('button[type=submit]');let div=document.createElement('div');div.className='col-12';div.innerHTML='<label class="form-label">Link dokumen / SharePoint (opsional)</label><input id="gReference" type="url" class="form-control" placeholder="https://tenant.sharepoint.com/..."><div class="help mt-1">Sesudah nomor tersimpan, User boleh mengubah URL referensi satu kali. Koreksi lain melalui admin.</div>';submit?.parentElement.before(div)}let t=item('templates',document.querySelector('#gTemplate')?.value);let pane=document.querySelector('#gBlocks')?.parentElement;if(t&&pane&&!pane.querySelector('#exampleTemplateLinks'))pane.insertAdjacentHTML('beforeend',`<div id="exampleTemplateLinks" class="mt- // Capture submit URL (existing handler saves the generated registry row synchronously)

// v15 visual link manager: reusable for announcement and template resources
function ndVisualLinks(initialLinks,onChange){
 let links=(initialLinks||[]).map(x=>({name:x.name||'',url:x.url||''})),editIndex=-1;
 const list=document.querySelector('#ndLinkList'),editor=document.querySelector('#ndLinkEditor');
 const title=document.querySelector('#ndLinkTitle'),label=document.querySelector('#ndLinkLabel'),url=document.querySelector('#ndLinkUrl');
 const redraw=()=>{list.innerHTML=links.map((l,i)=>`<div class="nd-link-tile" draggable="true" data-link-index="${i}"><div class="d-flex gap-2 align-items-start"><span aria-hidden="true" class="text-pink">⠿</span><div class="flex-grow-1 overflow-hidden"><strong class="d-block">${esc(l.name)}</strong><div class="help text-truncate" title="${esc(l.url)}">${esc(l.url)}</div></div></div><div class="nd-actions"><button type="button" class="btn btn-outline-primary btn-sm" data-nd-edit="${i}">Edit</button><button type="button" class="btn btn-outline-danger btn-sm" data-nd-delete="${i}">Hapus</button></div></div>`).join('')||'<div class="help p-2">Belum ada tautan. Klik Tambah Link untuk membuat tombol.</div>';onChange(links)};
 const edit=i=>{editIndex=i;title.textContent=i<0?'Tambah tombol link':'Edit tombol link';label.value=i<0?'':links[i].name;url.value=i<0?'':links[i].url;editor.hidden=false;label.focus();};
 document.querySelector('#ndLinkAdd').onclick=()=>{if(links.length>=5)return msg('Maksimal 5 link');edit(-1)};
 document.querySelector('#ndLinkCancel').onclick=()=>{editor.hidden=true};
 document.querySelector('#ndLinkSave').onclick=()=>{let n=label.value.trim(),u=validLink(url.value.trim());if(!n||!u)return msg('Isi nama tombol dan URL https:// yang valid');if(editIndex<0){if(links.length>=5)return msg('Maksimal 5 link');links.push({name:n,url:u})}else links[editIndex]={name:n,url:u};editor.hidden=true;redraw()};
 list.onclick=e=>{let b=e.target.closest('[data-nd-edit],[data-nd-delete]');if(!b)return;if(b.dataset.ndEdit!==undefined)edit(+b.dataset.ndEdit);if(b.dataset.ndDelete!==undefined){links.splice(+b.dataset.ndDelete,1);editor.hidden=true;redraw()}};
 let dragged=null;list.addEventListener('dragstart',e=>{let x=e.target.closest('[data-link-index]');if(!x)return;dragged=+x.dataset.linkIndex;x.classList.add('dragging')});list.addEventListener('dragend',e=>{e.target.closest('[data-link-index]')?.classList.remove('dragging');dragged=null});list.addEventListener('dragover',e=>{if(e.target.closest('[data-link-index]'))e.preventDefault()});list.addEventListener('drop',e=>{let target=e.target.closest('[data-link-index]');if(!target||dragged===null)return;e.preventDefault();const to=+target.dataset.linkIndex;if(to!==dragged){const [x]=links.splice(dragged,1);links.splice(to,0,x)}dragged=null;redraw()});
 redraw();return()=>links;
}
function ndLinksUI(){return `<div class="border-top mt-3 pt-3"><div class="d-flex flex-wrap justify-content-between align-items-center gap-3"><div><div class="fw-semibold">Tombol tautan</div><div class="help">Klik kartu untuk mengedit; tarik untuk mengurutkan (maks. 5)</div></div><button class="btn btn-outline-primary" type="button" id="ndLinkAdd">＋ Tambah Link</button></div><div class="nd-link-list" id="ndLinkList"></div><div class="nd-link-editor" id="ndLinkEditor" hidden><h6 id="ndLinkTitle">Tambah tombol link</h6><div class="row g-3"><div class="col-12 col-md-5"><label class="form-label" for="ndLinkLabel">Teks tombol</label><input class="form-control" id="ndLinkLabel" placeholder="Buka SharePoint" maxlength="90"></div><div class="col-12 col-md-7"><label class="form-label" for="ndLinkUrl">URL</label><input class="form-control" id="ndLinkUrl" type="url" placeholder="https://tenant.sharepoint.com/..."></div><div class="col-12"><div class="nd-actions"><button type="button" class="btn btn-primary" id="ndLinkSave">Simpan Link</button><button type="button" class="btn btn-outline-secondary" id="ndLinkCancel">Batal</button></div></div></div></div></div>`}
announcementEditor=function(ref){
 const a=ref?item('ann',ref):null;
 const body=`<div class="row g-3"><div class="col-12"><label class="form-label" for="ndAnnTitle">Judul pengumuman</label><input required id="ndAnnTitle" class="form-control" name="title" maxlength="180" value="${esc(a?.title||'')}" placeholder="Contoh: Panduan penggunaan nomor surat"></div><div class="col-12"><label class="form-label" for="ndAnnBody">Isi pengumuman</label><textarea id="ndAnnBody" name="body" rows="4" class="form-control" required placeholder="Tulis informasi yang mudah dipahami...">${esc(a?.body||'')}</textarea></div></div>${ndLinksUI()}<details class="mt-3 border rounded-3 p-3"><summary class="fw-semibold" style="cursor:pointer">Pengaturan tampilan (opsional)</summary><div class="row g-3 mt-1"><div class="col-12 col-sm-4"><label class="form-label">Prioritas</label><input name="priority" class="form-control" type="number" min="1" max="999" value="${esc(a?.priority||1)}"></div><div class="col-6 col-sm-4"><label class="form-label">Ukuran judul</label><select class="form-select" name="size">${['sm','md','lg','xl'].map(x=>`<option value="${x}" ${a?.size===x?'selected':''}>${{sm:'Kecil',md:'Normal',lg:'Besar',xl:'Ekstra besar'}[x]}</option>`).join('')}</select></div><div class="col-6 col-sm-4"><label class="form-label">Highlight</label><select class="form-select" name="highlight">${[['soft','Pink solid'],['border','Garis pink'],['none','Normal']].map(([x,y])=>`<option value="${x}" ${a?.highlight===x?'selected':''}>${y}</option>`).join('')}</select></div></div></details>`;
 let getLinks=()=>[];
 modal(a?'Edit pengumuman':'Tambah pengumuman',body,()=>{let title=formVal('title').trim(),body=formVal('body').trim();if(!title||!body){msg('Judul dan isi wajib diisi');return false}const x={id:a?.id||id(),title,body,links:getLinks(),priority:Math.max(1,+formVal('priority')||1),size:formVal('size'),highlight:formVal('highlight'),animation:'none'};if(a)Object.assign(a,x);else db.ann.push(x);save();render()});
 getLinks=ndVisualLinks(announcementLinks(a||{}),()=>{});
};
